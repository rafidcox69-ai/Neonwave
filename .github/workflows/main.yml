
name: Build Neon Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NeonWave-Android-Ready.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o NeonWave-Android-Ready.zip -d project
          echo "Project files:"
          ls -la project

      - name: Find Android project
        run: |
          find project -name gradlew -type f
          find project -name settings.gradle.kts -type f

      - name: Build APK
        run: |
          cd project/NeonWave-Android-Ready
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Music-APK
          path: project/**/build/outputs/apk/**/*.apk
          
